name: Minimal Build

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Upload built minimal binaries to a GitHub release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag to upload to (for example: v3.5.1). Leave empty to skip release upload."
        required: false
        type: string

jobs:
  linux-static-minimal:
    name: Minimal Binary ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - armv7-unknown-linux-musleabi
          - arm-unknown-linux-musleabihf
          - arm-unknown-linux-musleabi
          - mipsel-unknown-linux-musl
          - mips-unknown-linux-musl
          - mips64-unknown-linux-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            wget \
            xz-utils \
            file

      - name: Set version environment variable
        run: |
          if [[ "${{ inputs.upload_to_release }}" == "true" && -z "${{ inputs.release_tag }}" ]]; then
            echo "release_tag is required when upload_to_release is true"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            BUILD_VERSION="${GITHUB_REF_NAME#v}"
          else
            BUILD_VERSION="minimal-${GITHUB_SHA::7}"
          fi

          if [[ -n "${{ inputs.release_tag }}" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG=""
          fi

          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Build minimal static binary
        env:
          TOOLCHAIN_PREFIX: ${{ matrix.arch }}
          CMAKE_EXTRA_ARGS: >-
            -DCMAKE_BUILD_TYPE=MinSizeRel
            -DENABLE_AGGRESSIVE_OPT=OFF
            -DRTP2HTTPD_MINIMAL_BUILD=ON
            -DRTP2HTTPD_ENABLE_SIZE_OPTIMIZATIONS=ON
        run: ./scripts/build-static.sh

      - name: Prepare artifact
        id: prepare
        run: |
          ARCH="${{ matrix.arch }}"

          if [[ "$ARCH" == arm* ]]; then
            BASE_ARCH="${ARCH%%-*}"
            if [[ "$ARCH" == *"eabihf"* ]]; then
              ARCH_SHORT="${BASE_ARCH}-eabihf"
            elif [[ "$ARCH" == *"eabi"* ]]; then
              ARCH_SHORT="${BASE_ARCH}-eabi"
            else
              ARCH_SHORT="$BASE_ARCH"
            fi
          else
            ARCH_SHORT="${ARCH%%-*}"
          fi

          BINARY_PATH="build-${ARCH}-static/dist/usr/bin/rtp2httpd"

          if [ ! -f "$BINARY_PATH" ]; then
            echo "Error: Binary not found at $BINARY_PATH"
            exit 1
          fi

          OUTPUT_DIR="artifacts/${ARCH_SHORT}"
          OUTPUT_NAME="rtp2httpd-minimal-${BUILD_VERSION}-${ARCH_SHORT}"

          mkdir -p "$OUTPUT_DIR"
          cp "$BINARY_PATH" "${OUTPUT_DIR}/${OUTPUT_NAME}"
          cp rtp2httpd.conf "${OUTPUT_DIR}/rtp2httpd.conf"

          file "${OUTPUT_DIR}/${OUTPUT_NAME}"
          ls -lh "${OUTPUT_DIR}/${OUTPUT_NAME}"

          echo "artifact_dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=rtp2httpd-minimal-${ARCH_SHORT}" >> "$GITHUB_OUTPUT"
          echo "binary_name=${OUTPUT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate size report
        run: |
          ARCH="${{ matrix.arch }}"
          TOOL_PREFIX="toolchain/${ARCH}/bin/${ARCH}"
          BINARY_UNSTRIPPED="build-${ARCH}-static/rtp2httpd"
          BINARY_STRIPPED="${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.binary_name }}"
          REPORT_PATH="${{ steps.prepare.outputs.artifact_dir }}/size-report.txt"

          {
            echo "Architecture: ${ARCH}"
            echo "Binary: ${BINARY_STRIPPED}"
            echo
            echo "== file =="
            file "${BINARY_STRIPPED}"
            echo
            echo "== ls -lh =="
            ls -lh "${BINARY_STRIPPED}"
            echo
            echo "== size (unstripped) =="
            "${TOOL_PREFIX}-size" "${BINARY_UNSTRIPPED}"
            echo
            echo "== sections (stripped) =="
            "${TOOL_PREFIX}-readelf" -S "${BINARY_STRIPPED}"
            echo
            echo "== largest symbols (unstripped, top 80) =="
            "${TOOL_PREFIX}-nm" -S --size-sort "${BINARY_UNSTRIPPED}" | tail -n 80
          } > "${REPORT_PATH}"

          {
            echo "### Minimal Build Size Report: ${ARCH}"
            echo
            echo '```text'
            sed -n '1,120p' "${REPORT_PATH}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ steps.prepare.outputs.artifact_dir }}
          if-no-files-found: error

      - name: Upload binary to release
        if: ${{ inputs.upload_to_release }}
        run: |
          gh release upload \
            --repo ${{ github.repository }} \
            "${RELEASE_TAG}" \
            "${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.binary_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-static-minimal-mt7620:
    name: Minimal Binary mt7620-24kc
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            wget \
            xz-utils \
            file

      - name: Set version environment variable
        run: |
          if [[ "${{ inputs.upload_to_release }}" == "true" && -z "${{ inputs.release_tag }}" ]]; then
            echo "release_tag is required when upload_to_release is true"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            BUILD_VERSION="${GITHUB_REF_NAME#v}"
          else
            BUILD_VERSION="minimal-${GITHUB_SHA::7}"
          fi

          if [[ -n "${{ inputs.release_tag }}" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG=""
          fi

          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Build mt7620-optimized minimal static binary
        env:
          TOOLCHAIN_PREFIX: mipsel-unknown-linux-musl
          EXTRA_CFLAGS: -march=24kc -mtune=24kc -msoft-float
          EXTRA_LDFLAGS: -march=24kc -mtune=24kc -msoft-float
          CMAKE_EXTRA_ARGS: >-
            -DCMAKE_BUILD_TYPE=MinSizeRel
            -DENABLE_AGGRESSIVE_OPT=OFF
            -DRTP2HTTPD_MINIMAL_BUILD=ON
            -DRTP2HTTPD_ENABLE_SIZE_OPTIMIZATIONS=ON
        run: ./scripts/build-static.sh

      - name: Prepare artifact
        id: prepare
        run: |
          ARCH="mipsel-unknown-linux-musl"
          ARCH_SHORT="mipsel-mt7620-24kc"
          BINARY_PATH="build-${ARCH}-static/dist/usr/bin/rtp2httpd"

          if [ ! -f "$BINARY_PATH" ]; then
            echo "Error: Binary not found at $BINARY_PATH"
            exit 1
          fi

          OUTPUT_DIR="artifacts/${ARCH_SHORT}"
          OUTPUT_NAME="rtp2httpd-minimal-${BUILD_VERSION}-${ARCH_SHORT}"

          mkdir -p "$OUTPUT_DIR"
          cp "$BINARY_PATH" "${OUTPUT_DIR}/${OUTPUT_NAME}"
          cp rtp2httpd.conf "${OUTPUT_DIR}/rtp2httpd.conf"

          file "${OUTPUT_DIR}/${OUTPUT_NAME}"
          ls -lh "${OUTPUT_DIR}/${OUTPUT_NAME}"

          echo "artifact_dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=rtp2httpd-minimal-${ARCH_SHORT}" >> "$GITHUB_OUTPUT"
          echo "binary_name=${OUTPUT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate size report
        run: |
          ARCH="mipsel-unknown-linux-musl"
          TOOL_PREFIX="toolchain/${ARCH}/bin/${ARCH}"
          BINARY_UNSTRIPPED="build-${ARCH}-static/rtp2httpd"
          BINARY_STRIPPED="${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.binary_name }}"
          REPORT_PATH="${{ steps.prepare.outputs.artifact_dir }}/size-report.txt"

          {
            echo "Architecture: ${ARCH} (mt7620 / 24kc tuned)"
            echo "Binary: ${BINARY_STRIPPED}"
            echo
            echo "== file =="
            file "${BINARY_STRIPPED}"
            echo
            echo "== ls -lh =="
            ls -lh "${BINARY_STRIPPED}"
            echo
            echo "== size (unstripped) =="
            "${TOOL_PREFIX}-size" "${BINARY_UNSTRIPPED}"
            echo
            echo "== sections (stripped) =="
            "${TOOL_PREFIX}-readelf" -S "${BINARY_STRIPPED}"
            echo
            echo "== largest symbols (unstripped, top 80) =="
            "${TOOL_PREFIX}-nm" -S --size-sort "${BINARY_UNSTRIPPED}" | tail -n 80
          } > "${REPORT_PATH}"

          {
            echo "### Minimal Build Size Report: mt7620-24kc"
            echo
            echo '```text'
            sed -n '1,120p' "${REPORT_PATH}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ steps.prepare.outputs.artifact_dir }}
          if-no-files-found: error

      - name: Upload binary to release
        if: ${{ inputs.upload_to_release }}
        run: |
          gh release upload \
            --repo ${{ github.repository }} \
            "${RELEASE_TAG}" \
            "${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.binary_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openwrt-minimal-mt7620:
    name: Minimal OpenWrt Package mt7620
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set version environment variable
        run: |
          if [[ "${{ inputs.upload_to_release }}" == "true" && -z "${{ inputs.release_tag }}" ]]; then
            echo "release_tag is required when upload_to_release is true"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            BUILD_VERSION="${GITHUB_REF_NAME#v}"
          else
            BUILD_VERSION="minimal-${GITHUB_SHA::7}"
          fi

          if [[ -n "${{ inputs.release_tag }}" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG=""
          fi

          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Build minimal OpenWrt package
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: mipsel_24kc-24.10.4
          NO_SHFMT_CHECK: true
          PACKAGES: rtp2httpd
          V: sc
          RTP2HTTPD_MINIMAL_BUILD: 1

      - name: Prepare artifact
        id: prepare
        run: |
          PKG_PATH="$(find bin/packages/mipsel_24kc/action -maxdepth 1 -name 'rtp2httpd_*.ipk' | head -n 1)"

          if [[ -z "${PKG_PATH}" ]]; then
            echo "Error: OpenWrt package not found"
            find bin -maxdepth 4 -type f | sort
            exit 1
          fi

          OUTPUT_DIR="artifacts/openwrt-mipsel_24kc-mt7620"
          OUTPUT_NAME="rtp2httpd-minimal-${BUILD_VERSION}-openwrt-mipsel_24kc.ipk"

          mkdir -p "${OUTPUT_DIR}"
          cp "${PKG_PATH}" "${OUTPUT_DIR}/${OUTPUT_NAME}"
          ls -lh "${OUTPUT_DIR}/${OUTPUT_NAME}"

          echo "artifact_dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=rtp2httpd-minimal-openwrt-mipsel_24kc" >> "$GITHUB_OUTPUT"
          echo "package_name=${OUTPUT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate package report
        run: |
          REPORT_PATH="${{ steps.prepare.outputs.artifact_dir }}/package-report.txt"
          EXTRACT_DIR="$(mktemp -d)"
          PACKAGE_PATH="${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.package_name }}"

          cd "${EXTRACT_DIR}"
          mkdir data

          if ar t "${GITHUB_WORKSPACE}/${PACKAGE_PATH}" >/dev/null 2>&1; then
            ar x "${GITHUB_WORKSPACE}/${PACKAGE_PATH}"
            DATA_ARCHIVE="$(find . -maxdepth 1 -type f \\( -name 'data.tar.gz' -o -name 'data.tar.xz' -o -name 'data.tar.zst' -o -name 'data.tar.bz2' -o -name 'data.tar' \\) | head -n 1)"
            if [[ -z "${DATA_ARCHIVE}" ]]; then
              echo "Error: data archive not found inside package"
              find . -maxdepth 1 -type f | sort
              exit 1
            fi
            tar -xf "${DATA_ARCHIVE}" -C data
          else
            tar -xf "${GITHUB_WORKSPACE}/${PACKAGE_PATH}" -C data
          fi

          {
            echo "Architecture: mipsel_24kc (OpenWrt SDK 24.10.4)"
            echo "Package: ${PACKAGE_PATH}"
            echo
            echo "== package ls -lh =="
            ls -lh "${GITHUB_WORKSPACE}/${PACKAGE_PATH}"
            echo
            echo "== package file =="
            file "${GITHUB_WORKSPACE}/${PACKAGE_PATH}"
            echo
            echo "== package contents =="
            find data -type f | sort
            echo
            if [[ -f "data/usr/bin/rtp2httpd" ]]; then
              echo "== binary file =="
              file "data/usr/bin/rtp2httpd"
              echo
              echo "== binary ls -lh =="
              ls -lh "data/usr/bin/rtp2httpd"
              echo
              echo "== dynamic section =="
              readelf -d "data/usr/bin/rtp2httpd" || true
              echo
              echo "== section headers =="
              readelf -S "data/usr/bin/rtp2httpd" || true
            else
              echo "Binary data/usr/bin/rtp2httpd not found in package"
            fi
          } > "${GITHUB_WORKSPACE}/${REPORT_PATH}"

          {
            echo "### Minimal OpenWrt Package Report: mt7620"
            echo
            echo '```text'
            sed -n '1,160p' "${GITHUB_WORKSPACE}/${REPORT_PATH}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ steps.prepare.outputs.artifact_dir }}
          if-no-files-found: error

      - name: Upload package to release
        if: ${{ inputs.upload_to_release }}
        run: |
          gh release upload \
            --repo ${{ github.repository }} \
            "${RELEASE_TAG}" \
            "${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.package_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
