  openwrt-minimal-mt7620:
    name: Minimal OpenWrt Package mt7620
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set version environment variable
        run: |
          if [[ "${{ inputs.upload_to_release }}" == "true" && -z "${{ inputs.release_tag }}" ]]; then
            echo "release_tag is required when upload_to_release is true"
            exit 1
          fi

          if [[ -n "${{ inputs.release_tag }}" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG=""
          fi

          if [[ -n "${RELEASE_TAG}" ]]; then
            BUILD_VERSION="${RELEASE_TAG#v}"
            ASSET_VERSION="${BUILD_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            BUILD_VERSION="${GITHUB_REF_NAME#v}"
            ASSET_VERSION="${BUILD_VERSION}"
          else
            BUILD_VERSION="minimal-${GITHUB_SHA::7}"
            ASSET_VERSION="${GITHUB_SHA::7}"
          fi

          FILE_PREFIX="rtp2httpd-minimal"
          case "${ASSET_VERSION}" in
            *mini*|*minimal*)
              FILE_PREFIX="rtp2httpd"
              ;;
          esac

          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "ASSET_VERSION=${ASSET_VERSION}" >> "$GITHUB_ENV"
          echo "FILE_PREFIX=${FILE_PREFIX}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Build minimal OpenWrt packages in SDK container
        run: |
          SDK_OUT="${GITHUB_WORKSPACE}/openwrt-sdk-out"
          rm -rf "${SDK_OUT}"
          mkdir -p "${SDK_OUT}"

          docker pull ghcr.io/openwrt/sdk:mipsel_24kc-24.10.4

          docker run --rm \
            -v "${GITHUB_WORKSPACE}/openwrt-support:/feed" \
            -v "${GITHUB_WORKSPACE}:/src" \
            -v "${SDK_OUT}:/artifacts" \
            ghcr.io/openwrt/sdk:mipsel_24kc-24.10.4 \
            /bin/bash -lc '
              set -euo pipefail
              export RTP2HTTPD_SOURCE_DIR=/src

              cp feeds.conf.default feeds.conf
              echo "src-link action /feed" >> feeds.conf

              ./scripts/feeds update -a
              ./scripts/feeds install -p action -f rtp2httpd-minimal
              ./scripts/feeds install -p action -f luci-app-rtp2httpd-minimal

              printf "%s\n" \
                "CONFIG_PACKAGE_rtp2httpd-minimal=m" \
                "CONFIG_PACKAGE_luci-app-rtp2httpd-minimal=m" \
                "CONFIG_PACKAGE_luci-i18n-rtp2httpd-minimal-zh-cn=m" \
                >> .config

              make defconfig
              make package/feeds/action/rtp2httpd-minimal/compile V=sc
              make package/feeds/action/luci-app-rtp2httpd-minimal/compile V=sc

              mkdir -p /artifacts/meta
              cp -a bin /artifacts/
              if [ -d logs ]; then
                cp -a logs /artifacts/
              fi

              {
                echo "== searched files =="
                find bin build_dir staging_dir -type f 2>/dev/null | sort | sed -n "1,300p"
                echo
                echo "== cmake summary grep =="
                grep -R -n -E "rtp2httpd build configuration:|Minimal build:|Size opt:|Web UI:|Status:|FCC:|FEC:|M3U/EPG:|RTSP:|HTTP proxy:|Snapshot:" build_dir 2>/dev/null || true
                echo
                echo "== cmake cache grep =="
                grep -R -n -E "RTP2HTTPD_MINIMAL_BUILD|RTP2HTTPD_ENABLE_(WEB_UI|STATUS|FCC|FEC|M3U|RTSP|HTTP_PROXY|SNAPSHOT|SIZE_OPTIMIZATIONS)|CMAKE_BUILD_TYPE|ENABLE_AGGRESSIVE_OPT" build_dir 2>/dev/null || true
              } > /artifacts/meta/build-config-report.txt
            '

          {
            echo "### OpenWrt Build Config Report: mt7620"
            echo
            echo '```text'
            sed -n '1,200p' "${SDK_OUT}/meta/build-config-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare artifact
        id: prepare
        run: |
          PKG_PATH="$(find openwrt-sdk-out/bin/packages/mipsel_24kc/action -maxdepth 1 -name 'rtp2httpd-minimal_*.ipk' | head -n 1)"
          LUCI_PATH="$(find openwrt-sdk-out/bin/packages -type f -name 'luci-app-rtp2httpd-minimal*.ipk' | head -n 1)"
          I18N_PATH="$(find openwrt-sdk-out/bin/packages -type f -name 'luci-i18n-rtp2httpd-minimal-zh*ipk' | head -n 1)"

          if [[ -z "${PKG_PATH}" ]]; then
            echo "Error: OpenWrt package not found"
            find openwrt-sdk-out -maxdepth 6 -type f | sort
            exit 1
          fi
          if [[ -z "${LUCI_PATH}" ]]; then
            echo "Error: minimal LuCI package not found"
            find openwrt-sdk-out -maxdepth 6 -type f | sort
            exit 1
          fi
          if [[ -z "${I18N_PATH}" ]]; then
            echo "Error: minimal LuCI i18n package not found"
            find openwrt-sdk-out -maxdepth 6 -type f | sort
            exit 1
          fi

          OUTPUT_DIR="artifacts/openwrt-mipsel_24kc-mt7620"
          OUTPUT_NAME="${FILE_PREFIX}-${ASSET_VERSION}-openwrt-mipsel_24kc.ipk"
          LUCI_NAME="$(basename "${LUCI_PATH}")"
          I18N_NAME="$(basename "${I18N_PATH}")"

          mkdir -p "${OUTPUT_DIR}"
          cp "${PKG_PATH}" "${OUTPUT_DIR}/${OUTPUT_NAME}"
          cp "${LUCI_PATH}" "${OUTPUT_DIR}/${LUCI_NAME}"
          cp "${I18N_PATH}" "${OUTPUT_DIR}/${I18N_NAME}"
          cp "openwrt-sdk-out/meta/build-config-report.txt" "${OUTPUT_DIR}/build-config-report.txt"
          ls -lh "${OUTPUT_DIR}/${OUTPUT_NAME}"
          ls -lh "${OUTPUT_DIR}/${LUCI_NAME}"
          ls -lh "${OUTPUT_DIR}/${I18N_NAME}"

          echo "artifact_dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=rtp2httpd-minimal-openwrt-mipsel_24kc" >> "$GITHUB_OUTPUT"
          echo "package_name=${OUTPUT_NAME}" >> "$GITHUB_OUTPUT"
          echo "luci_name=${LUCI_NAME}" >> "$GITHUB_OUTPUT"
          echo "i18n_name=${I18N_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate package report
        run: |
          REPORT_PATH="${{ steps.prepare.outputs.artifact_dir }}/package-report.txt"
          EXTRACT_DIR="$(mktemp -d)"
          PACKAGE_PATH="${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.package_name }}"

          cd "${EXTRACT_DIR}"
          mkdir package-root payload

          if ar t "${GITHUB_WORKSPACE}/${PACKAGE_PATH}" >/dev/null 2>&1; then
            ar x "${GITHUB_WORKSPACE}/${PACKAGE_PATH}"
            DATA_ARCHIVE=""
            for candidate in data.tar.gz data.tar.xz data.tar.zst data.tar.bz2 data.tar; do
              if [[ -f "${candidate}" ]]; then
                DATA_ARCHIVE="${candidate}"
                break
              fi
            done
            if [[ -z "${DATA_ARCHIVE}" ]]; then
              echo "Error: data archive not found inside package"
              find . -maxdepth 1 -type f | sort
              exit 1
            fi
            tar -xf "${DATA_ARCHIVE}" -C payload
          else
            tar -xf "${GITHUB_WORKSPACE}/${PACKAGE_PATH}" -C package-root

            DATA_ARCHIVE=""
            for candidate in \
              package-root/data.tar.gz \
              package-root/data.tar.xz \
              package-root/data.tar.zst \
              package-root/data.tar.bz2 \
              package-root/data.tar; do
              if [[ -f "${candidate}" ]]; then
                DATA_ARCHIVE="${candidate}"
                break
              fi
            done

            if [[ -n "${DATA_ARCHIVE}" ]]; then
              tar -xf "${DATA_ARCHIVE}" -C payload
            else
              cp -a package-root/. payload/
            fi
          fi

          {
            echo "Architecture: mipsel_24kc (OpenWrt SDK 24.10.4)"
            echo "Package: ${PACKAGE_PATH}"
            echo
            echo "== package ls -lh =="
            ls -lh "${GITHUB_WORKSPACE}/${PACKAGE_PATH}"
            echo
            echo "== package file =="
            file "${GITHUB_WORKSPACE}/${PACKAGE_PATH}"
            echo
            echo "== package root contents =="
            find package-root -type f | sort
            echo
            echo "== payload contents =="
            find payload -type f | sort
            echo
            if [[ -f "payload/usr/bin/rtp2httpd" ]]; then
              echo "== binary file =="
              file "payload/usr/bin/rtp2httpd"
              echo
              echo "== binary ls -lh =="
              ls -lh "payload/usr/bin/rtp2httpd"
              echo
              echo "== dynamic section =="
              readelf -d "payload/usr/bin/rtp2httpd" || true
              echo
              echo "== section headers =="
              readelf -S "payload/usr/bin/rtp2httpd" || true
            else
              echo "Binary payload/usr/bin/rtp2httpd not found in package"
            fi
          } > "${GITHUB_WORKSPACE}/${REPORT_PATH}"

          {
            echo "### Minimal OpenWrt Package Report: mt7620"
            echo
            echo '```text'
            sed -n '1,160p' "${GITHUB_WORKSPACE}/${REPORT_PATH}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ steps.prepare.outputs.artifact_dir }}
          if-no-files-found: error

      - name: Ensure release exists
        if: ${{ inputs.upload_to_release }}
        run: |
          if ! gh release view --repo ${{ github.repository }} "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create \
              --repo ${{ github.repository }} \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --notes "Automated minimal build artifacts for ${RELEASE_TAG}" \
              "${RELEASE_TAG}" || true
          fi

          gh release view --repo ${{ github.repository }} "${RELEASE_TAG}" >/dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload package to release
        if: ${{ inputs.upload_to_release }}
        run: |
          gh release upload \
            --clobber \
            --repo ${{ github.repository }} \
            "${RELEASE_TAG}" \
            "${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.package_name }}" \
            "${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.luci_name }}" \
            "${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.i18n_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
