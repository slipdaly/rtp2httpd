name: Minimal Build

on:
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: "Upload built minimal binaries to a GitHub release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag to upload to (for example: v3.5.1). Leave empty to skip release upload."
        required: false
        type: string

jobs:
  linux-static-minimal:
    name: Minimal Binary ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
          - armv7-unknown-linux-musleabi
          - arm-unknown-linux-musleabihf
          - arm-unknown-linux-musleabi
          - mipsel-unknown-linux-musl
          - mips-unknown-linux-musl
          - mips64-unknown-linux-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            wget \
            xz-utils \
            file

      - name: Set version environment variable
        run: |
          if [[ "${{ inputs.upload_to_release }}" == "true" && -z "${{ inputs.release_tag }}" ]]; then
            echo "release_tag is required when upload_to_release is true"
            exit 1
          fi

          if [[ -n "${{ inputs.release_tag }}" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG=""
          fi

          if [[ -n "${RELEASE_TAG}" ]]; then
            BUILD_VERSION="${RELEASE_TAG#v}"
            ASSET_VERSION="${BUILD_VERSION}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            BUILD_VERSION="${GITHUB_REF_NAME#v}"
            ASSET_VERSION="${BUILD_VERSION}"
          else
            BUILD_VERSION="minimal-${GITHUB_SHA::7}"
            ASSET_VERSION="${GITHUB_SHA::7}"
          fi

          FILE_PREFIX="rtp2httpd-minimal"
          case "${ASSET_VERSION}" in
            *mini*|*minimal*)
              FILE_PREFIX="rtp2httpd"
              ;;
          esac

          echo "BUILD_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${BUILD_VERSION}" >> "$GITHUB_ENV"
          echo "ASSET_VERSION=${ASSET_VERSION}" >> "$GITHUB_ENV"
          echo "FILE_PREFIX=${FILE_PREFIX}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Build minimal static binary
        env:
          TOOLCHAIN_PREFIX: ${{ matrix.arch }}
          CMAKE_EXTRA_ARGS: >-
            -DCMAKE_BUILD_TYPE=MinSizeRel
            -DENABLE_AGGRESSIVE_OPT=OFF
            -DRTP2HTTPD_MINIMAL_BUILD=ON
            -DRTP2HTTPD_ENABLE_SIZE_OPTIMIZATIONS=ON
        run: ./scripts/build-static.sh

      - name: Prepare artifact
        id: prepare
        run: |
          ARCH="${{ matrix.arch }}"

          if [[ "$ARCH" == arm* ]]; then
            BASE_ARCH="${ARCH%%-*}"
            if [[ "$ARCH" == *"eabihf"* ]]; then
              ARCH_SHORT="${BASE_ARCH}-eabihf"
            elif [[ "$ARCH" == *"eabi"* ]]; then
              ARCH_SHORT="${BASE_ARCH}-eabi"
            else
              ARCH_SHORT="$BASE_ARCH"
            fi
          else
            ARCH_SHORT="${ARCH%%-*}"
          fi

          BINARY_PATH="build-${ARCH}-static/dist/usr/bin/rtp2httpd"

          if [ ! -f "$BINARY_PATH" ]; then
            echo "Error: Binary not found at $BINARY_PATH"
            exit 1
          fi

          OUTPUT_DIR="artifacts/${ARCH_SHORT}"
          OUTPUT_NAME="${FILE_PREFIX}-${ASSET_VERSION}-${ARCH_SHORT}"

          mkdir -p "$OUTPUT_DIR"
          cp "$BINARY_PATH" "${OUTPUT_DIR}/${OUTPUT_NAME}"
          cp rtp2httpd.conf "${OUTPUT_DIR}/rtp2httpd.conf"

          file "${OUTPUT_DIR}/${OUTPUT_NAME}"
          ls -lh "${OUTPUT_DIR}/${OUTPUT_NAME}"

          echo "artifact_dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=rtp2httpd-minimal-${ARCH_SHORT}" >> "$GITHUB_OUTPUT"
          echo "binary_name=${OUTPUT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate size report
        run: |
          ARCH="${{ matrix.arch }}"
          TOOL_PREFIX="toolchain/${ARCH}/bin/${ARCH}"
          BINARY_UNSTRIPPED="build-${ARCH}-static/rtp2httpd"
          BINARY_STRIPPED="${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.binary_name }}"
          REPORT_PATH="${{ steps.prepare.outputs.artifact_dir }}/size-report.txt"

          {
            echo "Architecture: ${ARCH}"
            echo "Binary: ${BINARY_STRIPPED}"
            echo
            echo "== file =="
            file "${BINARY_STRIPPED}"
            echo
            echo "== ls -lh =="
            ls -lh "${BINARY_STRIPPED}"
            echo
            echo "== size (unstripped) =="
            "${TOOL_PREFIX}-size" "${BINARY_UNSTRIPPED}"
            echo
            echo "== sections (stripped) =="
            "${TOOL_PREFIX}-readelf" -S "${BINARY_STRIPPED}"
            echo
            echo "== largest symbols (unstripped, top 80) =="
            "${TOOL_PREFIX}-nm" -S --size-sort "${BINARY_UNSTRIPPED}" | tail -n 80
          } > "${REPORT_PATH}"

          {
            echo "### Minimal Build Size Report: ${ARCH}"
            echo
            echo '```text'
            sed -n '1,120p' "${REPORT_PATH}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ steps.prepare.outputs.artifact_dir }}
          if-no-files-found: error

      - name: Ensure release exists
        if: ${{ inputs.upload_to_release }}
        run: |
          if ! gh release view --repo ${{ github.repository }} "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create \
              --repo ${{ github.repository }} \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --notes "Automated minimal build artifacts for ${RELEASE_TAG}" \
              "${RELEASE_TAG}" || true
          fi

          gh release view --repo ${{ github.repository }} "${RELEASE_TAG}" >/dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary to release
        if: ${{ inputs.upload_to_release }}
        run: |
          gh release upload \
            --clobber \
            --repo ${{ github.repository }} \
            "${RELEASE_TAG}" \
            "${{ steps.prepare.outputs.artifact_dir }}/${{ steps.prepare.outputs.binary_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

